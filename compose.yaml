x-agent-environment: &agent-environment
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
  OPENAI_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
  ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
  ANTHROPIC_AUTH_TOKEN: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
  ANTHROPIC_API_KEY: ""
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
  NEMO_RELAY_OPENAI_AUTH_HEADER: Bearer ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
  NEMO_RELAY_ANTHROPIC_AUTH_HEADER: Bearer ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}

x-development-environment: &development-environment
  working_dir: /workspace
  depends_on:
    otel-collector:
      condition: service_started
  volumes:
    - ./workspace:/workspace
    - ./config/codex:/etc/codex:ro
    - codex-home:/home/vscode/.codex
  environment:
    <<: *agent-environment
  stdin_open: true
  tty: true

name: ai-workspace

services:
  node:
    <<: *development-environment
    build:
      context: .
      dockerfile: containers/node.Dockerfile
    image: vercel-gateway-agents-node:local

  java:
    <<: *development-environment
    build:
      context: .
      dockerfile: containers/java.Dockerfile
    image: vercel-gateway-agents-java:local
    volumes:
      - ./workspace:/workspace
      - ./config/codex:/etc/codex:ro
      - codex-home:/home/vscode/.codex
      - maven-cache:/home/vscode/.m2
      - gradle-cache:/home/vscode/.gradle

  rust:
    <<: *development-environment
    build:
      context: .
      dockerfile: containers/rust.Dockerfile
    image: vercel-gateway-agents-rust:local

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command:
      - --config=/etc/otelcol-contrib/config${OTEL_ENABLED:+.dash0}.yaml
    environment:
      DASH0_OTLP_ENDPOINT: ${DASH0_OTLP_ENDPOINT:-http://127.0.0.1:4318}
      DASH0_AUTH_TOKEN: ${DASH0_AUTH_TOKEN:-}
      DASH0_DATASET: ${DASH0_DATASET:-default}
      OTEL_COLLECTOR_LOG_LEVEL: ${OTEL_COLLECTOR_LOG_LEVEL:-debug}
      OTEL_DEBUG_VERBOSITY: ${OTEL_DEBUG_VERBOSITY:-basic}
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./config/otel-collector.dash0.yaml:/etc/otelcol-contrib/config.dash0.yaml:ro
    stop_grace_period: 10s

volumes:
  codex-home:
  gradle-cache:
  maven-cache:
